[project]
name = "musefy"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/backend",
    "packages/scraper",
    "packages/cli",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.mypy]
strict = true
files = ['packages', 'tests', 'migrations']

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ['E4', 'E7', 'E9', 'F', 'I', 'UP', 'ASYNC']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
testpaths = ['tests']
