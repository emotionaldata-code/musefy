[project]
name = "musefy-cli"
version = "0.1.0"
description = "Musefy cli"
requires-python = ">=3.13"
dependencies = [
    "musefy-core",
    "musefy-scraper",
]

[project.scripts]
musefy = "musefy_cli.main:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
musefy-core = { workspace = true }
musefy-scraper = { workspace = true }
