[project]
name = "musefy-core"
version = "0.1.0"
description = "Musefy core"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "pgvector>=0.4.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "torch>=2.9,<3",
    "transformers>=4.57,<6",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
