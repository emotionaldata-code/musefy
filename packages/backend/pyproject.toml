[project]
name = "musefy-backend"
version = "0.1.0"
description = "Musefy backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.2",
    "httpx>=0.28,<1",
    "musefy-core",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
musefy-core = { workspace = true }
