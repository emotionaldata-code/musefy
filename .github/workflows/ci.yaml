name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: musefy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: musefy
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: musefy_test
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U musefy -d musefy_test' --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://musefy:test-only@127.0.0.1:5432/musefy_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.7'
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check packages tests migrations
      - run: uv run ruff format --check packages tests migrations
      - run: uv run mypy
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/frontend/package-lock.json
      - run: npm ci
        working-directory: packages/frontend
      - run: npm run lint && npm run build
        working-directory: packages/frontend
      - run: npx playwright install --with-deps chrome
        working-directory: packages/frontend
      - run: npm test
        working-directory: packages/frontend
      - run: docker build -t musefy:ci .
      - run: docker build -t musefy-frontend:ci packages/frontend
